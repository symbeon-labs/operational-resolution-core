<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>ORC symbol</title>
  <desc>Scan frame, resolution ring, check mark and completion arc.</desc>
  <defs>
    <linearGradient id="cyanGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19D7FF"/>
      <stop offset="1" stop-color="#63F04B"/>
    </linearGradient>
    <linearGradient id="resolve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19D7FF"/>
      <stop offset=".55" stop-color="#73F34A"/>
      <stop offset="1" stop-color="#B8FF3D"/>
    </linearGradient>
    <linearGradient id="complete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3045"/>
      <stop offset=".52" stop-color="#FF9A2A"/>
      <stop offset="1" stop-color="#8AF23D"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 126h78c18 0 32 14 32 32v26" stroke="#19D7FF" stroke-width="34"/>
    <path d="M420 126h-78c-18 0-32 14-32 32v26" stroke="#63F04B" stroke-width="34"/>

    <path d="M108 390c42 58 254 58 296 0" stroke="url(#complete)" stroke-width="28" filter="url(#glow)"/>

    <path d="M185 224a88 88 0 0 1 142-43" stroke="#63F04B" stroke-width="26"/>
    <path d="M337 208a88 88 0 0 1-10 91" stroke="url(#resolve)" stroke-width="26"/>
    <path d="M285 326a88 88 0 0 1-93-54" stroke="#18D7FF" stroke-width="26"/>
    <path d="M176 246a88 88 0 0 1 15-35" stroke="#18D7FF" stroke-width="26"/>

    <path d="M218 258l37 37 67-73" stroke="url(#resolve)" stroke-width="30" filter="url(#glow)"/>
  </g>
</svg>
